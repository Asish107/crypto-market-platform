name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write

# Never two applies against the same state at once.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.11.1"
  PROJECT_ID: dataengproj01

jobs:
  apply:
    name: terraform apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: init
        working-directory: infra/envs/${{ inputs.environment || 'dev' }}
        run: terraform init -backend-config="bucket=${{ env.PROJECT_ID }}-tfstate"

      - name: apply
        working-directory: infra/envs/${{ inputs.environment || 'dev' }}
        run: |
          terraform apply -auto-approve -input=false -lock-timeout=5m \
            -var="billing_account=${{ vars.BILLING_ACCOUNT }}" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}"

      - name: outputs
        working-directory: infra/envs/${{ inputs.environment || 'dev' }}
        run: terraform output -json | tee "$GITHUB_STEP_SUMMARY"

  image:
    name: build + push consumer image
    runs-on: ubuntu-latest
    needs: apply
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: build and push
        working-directory: ingest
        env:
          # SHA tag, never :latest. With a mutable tag you cannot tell which
          # code is running on the VM, which makes an incident unanswerable.
          IMAGE: us-central1-docker.pkg.dev/${{ env.PROJECT_ID }}/market-images/consumer
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"
          echo "IMAGE_URL=$IMAGE:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: roll the ingest VM onto the new image
        working-directory: infra/envs/${{ inputs.environment || 'dev' }}
        run: |
          terraform init -backend-config="bucket=${{ env.PROJECT_ID }}-tfstate"
          terraform apply -auto-approve -input=false \
            -var="billing_account=${{ vars.BILLING_ACCOUNT }}" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -var="ingest_vm_enabled=${{ vars.INGEST_VM_ENABLED || 'false' }}" \
            -var="ingest_image=$IMAGE_URL"

  # Phase 3 appends: dbt build, and dbt docs generate -> GitHub Pages.
