name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write

# Never two applies against the same state at once.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.11.1"
  PROJECT_ID: dataengproj01
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  # The image is built FIRST, because terraform needs to know which image the
  # ingest VM should run. An earlier version applied first and built second,
  # which meant the apply had no image to pass - so it disabled the VM, and
  # every deploy silently tore down the running consumer before rebuilding it.
  # One apply, with the image already known, has no such window.
  image:
    name: build + push consumer image
    runs-on: ubuntu-latest
    outputs:
      image_url: ${{ steps.build.outputs.image_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: build and push
        id: build
        working-directory: ingest
        env:
          # SHA tag, never :latest. With a mutable tag you cannot tell which
          # code is running on the VM, which makes an incident unanswerable.
          IMAGE: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/market-images/consumer
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"
          echo "image_url=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  apply:
    name: terraform apply
    runs-on: ubuntu-latest
    needs: image
    environment: ${{ inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: init
        working-directory: infra/envs/${{ inputs.environment || 'dev' }}
        run: terraform init -backend-config="bucket=${{ env.PROJECT_ID }}-tfstate"

      - name: apply
        working-directory: infra/envs/${{ inputs.environment || 'dev' }}
        run: |
          terraform apply -auto-approve -input=false -lock-timeout=10m \
            -var="billing_account=${{ vars.BILLING_ACCOUNT }}" \
            -var="alert_email=${{ vars.ALERT_EMAIL }}" \
            -var="ingest_vm_enabled=${{ vars.INGEST_VM_ENABLED || 'false' }}" \
            -var="ingest_image=${{ needs.image.outputs.image_url }}"

      - name: outputs
        working-directory: infra/envs/${{ inputs.environment || 'dev' }}
        run: terraform output -json | tee "$GITHUB_STEP_SUMMARY"

  dbt:
    name: dbt build (production)
    runs-on: ubuntu-latest
    needs: apply
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - run: pip install -r transform/requirements.txt
      - run: dbt deps --project-dir transform --profiles-dir transform

      - name: dbt build
        env:
          GCP_PROJECT: ${{ env.PROJECT_ID }}
        run: dbt build --project-dir transform --profiles-dir transform

  # Remaining: deploy Dagster to Cloud Run, and dbt docs -> GitHub Pages.
