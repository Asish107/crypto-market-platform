version: 2

models:
  - name: fct_trades
    description: >
      Deduped tick tape, one row per executed trade. The source of truth for
      every price and volume figure in the platform.
    config:
      contract:
        enforced: true
      # A contracted incremental model must declare this explicitly. `fail` is
      # the right choice here: an unexpected column change should stop the
      # build, not be silently absorbed into a table people trust.
      on_schema_change: fail

    columns:
      - name: trade_id
        data_type: int64
        description: Exchange trade id. Contiguous per product - the basis of gap detection.
        constraints:
          - type: not_null
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: product_id
        data_type: string
        constraints:
          - type: not_null
        data_tests:
          - accepted_values:
              values: ['BTC-USD', 'ETH-USD', 'SOL-USD']

      - name: sequence
        data_type: int64
        description: >
          Coinbase's per-product event counter. Recorded for completeness but
          NOT used for continuity - it counts events on channels we do not
          subscribe to. See ADR 0007.

      - name: price
        data_type: numeric
        constraints:
          - type: not_null
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "> 0"
          # Distributional guard. Not a business rule - a tripwire for a
          # decimal-place or unit error, which is the failure that silently
          # corrupts every downstream number.
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0.0001
              max_value: 10000000

      - name: size
        data_type: numeric
        constraints:
          - type: not_null
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "> 0"

      - name: notional
        data_type: numeric
        description: price * size, in quote currency.

      - name: side
        data_type: string
        description: The MAKER's side, as reported by the exchange.
        data_tests:
          - accepted_values:
              values: ['buy', 'sell']

      - name: taker_side
        data_type: string
        description: >
          The aggressor's side - the inverse of `side`. This is what "buy
          volume" means in every downstream imbalance metric.
        data_tests:
          - accepted_values:
              values: ['buy', 'sell']

      - name: is_backfilled
        data_type: boolean
        description: >
          Recovered from the REST API rather than received live. Their
          ingest_lag_ms measures the length of the outage, not pipeline
          latency, so every latency measure excludes them.

      - name: maker_order_id
        data_type: string
      - name: taker_order_id
        data_type: string

      - name: event_time
        data_type: timestamp
        constraints:
          - type: not_null

      - name: ingest_time
        data_type: timestamp
        constraints:
          - type: not_null

      - name: ingest_lag_ms
        data_type: int64
        description: >
          Exchange event time to local receive time. Legitimately NEGATIVE
          under clock skew; not clamped, because that would hide a real
          operational problem.

      - name: event_minute
        data_type: timestamp
      - name: event_date
        data_type: date
        constraints:
          - type: not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [trade_id, product_id]

  - name: fct_bars_1m
    description: >
      OHLCV bars at one-minute grain, with VWAP and taker-side volume
      imbalance. Rolled up rather than recomputed for coarser intervals.
    config:
      contract:
        enforced: true
      on_schema_change: fail

    columns:
      - name: product_id
        data_type: string
        constraints: [{type: not_null}]
        data_tests:
          - relationships:
              to: ref('dim_products')
              field: product_id

      - name: bar_start
        data_type: timestamp
        constraints: [{type: not_null}]
      - name: bar_end
        data_type: timestamp
        constraints: [{type: not_null}]

      - name: open
        data_type: numeric
        constraints: [{type: not_null}]
      - name: high
        data_type: numeric
        constraints: [{type: not_null}]
      - name: low
        data_type: numeric
        constraints: [{type: not_null}]
      - name: close
        data_type: numeric
        constraints: [{type: not_null}]

      - name: volume
        data_type: numeric
        constraints: [{type: not_null}]
        data_tests:
          - dbt_utils.expression_is_true: {expression: "> 0"}
      - name: quote_volume
        data_type: numeric
      - name: trade_count
        data_type: int64
        data_tests:
          - dbt_utils.expression_is_true: {expression: ">= 1"}

      - name: vwap
        data_type: numeric
        description: Volume-weighted, not a mean of prices - dust trades must not weigh as much as blocks.

      - name: buy_volume
        data_type: numeric
        description: Volume where the TAKER was the buyer, i.e. buyers crossed the spread.
      - name: sell_volume
        data_type: numeric
      - name: volume_imbalance
        data_type: numeric
        description: (buy - sell) / total, in [-1, 1]. Positive means buyers were the aggressors.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: -1
              max_value: 1

      - name: avg_ingest_lag_ms
        data_type: int64
      - name: first_trade_id
        data_type: int64
      - name: last_trade_id
        data_type: int64
      - name: event_date
        data_type: date
        constraints: [{type: not_null}]

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [product_id, bar_start]
